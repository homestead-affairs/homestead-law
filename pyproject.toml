[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homestead-law"
version = "0.0.1"
description = "Homestead · Affairs — module one. The legal module (Law Gazelle), local-first on SQLite, pinning homestead.keep."
requires-python = ">=3.10"
license = { text = "MIT" }

# Module one of the Homestead · Affairs face. It is **self-contained**: it ships
# to a self-represented parent or a legal-aid clinic who double-clicks it, so its
# store is embedded SQLite — a linked library, not a server (the 2026-08-04
# "no listening socket" decision holds; SQLite binds no port). The shared
# Postgres engine is a *sync target* on the fleet side, not a runtime dependency
# of the shipped app.
#
# It pins `homestead.keep` — the import-pure record/deadline/evidence/rung core —
# from PyPI (the Möbius rule: depend on contracts and pinned versions, no silent
# vendoring). The engine ships as the distribution **homestead-affairs** (the bare
# `homestead` name on PyPI is an unrelated abandoned package), while the import is
# still `import homestead` — the scikit-learn/sklearn split. The floor is the
# first published engine (0.0.2, where homestead.keep.store landed); the `<1.0`
# cap means a real compatibility range, because the engine's release config cuts
# 1.0.0 on a breaking change rather than declaring it (see its
# release-please-config.json).
#
# sqlite3 is stdlib — no dependency line for the store. holidays arrives through
# homestead.keep (its deadline arithmetic), declared there, not re-declared here.
dependencies = ["homestead-affairs>=0.0.2,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["homestead_law"]
